function initGimmicks(){let d=gimmickDefs[courseIndex];gimmicks=d.f.map((f,i)=>({s:L*f,i,type:courseIndex>=10?[2,2,4,2,4,1,2,3,0,4,2,2][courseIndex-10]:courseIndex,name:d.name}));for(let r of [player,...bots]){r.gimmickCD=0;r.gimmickSeen=new Set();r.bossPhase=-1;r.bossBurst=0;r.bossAction=9;}}
function gimmickPose(g,t=raceTime,lap=Math.max(0,Math.floor(player.s/L))){let phase=(t+g.i*2.1)%6,side=(Math.floor((t+g.i*2.1)/6)%2?1:-1);switch(g.type){case 0:return {lane:0,w:5,active:phase>1.2&&phase<4.9,warning:phase<=1.2,side};case 1:return {lane:side*2.55,w:1.85,active:phase>=2&&phase<4.7,warning:phase>=.8&&phase<2,side};case 2:return {lane:Math.sin((t+g.i)*1.25)*3.6,w:1.38,active:true,warning:false,side};case 3:return {lane:(lap+g.i)%2?2.1:-2.1,w:1.45,active:true,warning:false,side};default:return {lane:side*2.5,w:2.0,active:true,warning:phase>5,side};}}
function gimmickTick(dt){for(let r of activeRacers()){r.gimmickCD=Math.max(0,r.gimmickCD-dt);if(r.fall||r.short||r.roof||r.wall||r.jump||r.air||r.luckStop>0)continue;let lap=Math.max(0,Math.floor(r.s/L));for(let g of gimmicks){let p=gimmickPose(g,raceTime,Math.max(0,Math.floor(player.s/L))),ds=wrapS(r.s-g.s+L/2)-L/2;if(g.type===0){if(p.active&&Math.abs(ds)<12){r.lane=Math.max(-8.1,Math.min(8.1,r.lane+p.side*dt*(r===player?2.3:1.1)));if(r===player&&r.gimmickCD<=0){flash('突風！ ハンドルで補正！');r.gimmickCD=2;}}continue;}if(!p.active||Math.abs(ds)>3||Math.abs(r.lane-p.lane)>p.w||r.gimmickCD>0)continue;r.gimmickCD=1.5;if(r.star>0)continue;if(r.shield){r.shield=false;if(r===player)flash('シールドでギミック回避！');continue;}dropCoin(r,true);r.speed*=.55;r.slow=Math.max(r.slow,1.15);r.dash=0;r.coinTurbo=0;if(r===player)flash(g.name+'！ コイン落下・減速！');}}}
function drawGimmicks(){for(let g of gimmicks){if(v260LowFx()&&v260TrackGap(player.s,g.s)>155)continue;let p=gimmickPose(g),a=at(g.s,p.lane),col=C(p.active?'ff6648':'ffd657');if(g.type===0){for(let j=-3;j<=3;j++){let q=at(g.s+j*3),x=p.side*(Math.sin(raceTime*5+j)*3);box(q.x+q.rx*x,.14,q.z+q.rz*x,3.6,.045,.3,C(p.active?'eaffff':'8dd5e9'),q.yaw);}continue;}let q=at(g.s-2,p.lane),z=at(g.s+2,p.lane);quad(pt(q,-p.w,.18),pt(q,p.w,.18),pt(z,p.w,.18),pt(z,-p.w,.18),C(p.active?'d34e38':'e9c45c'));if(g.type===1){if(p.active)for(let j=-1;j<=1;j++)cone(a.x+a.rx*j*.8,.18,a.z+a.rz*j*.8,.65,2.1+Math.sin(raceTime*12+j)*.7,C(j===0?'ffe467':'ff652b'),7);else for(let j=-1;j<=1;j++)box(a.x+a.rx*j*.8,.2,a.z+a.rz*j*.8,.6,.10,.7,col,a.yaw);}else if(g.type===2){box(a.x,.12,a.z,2.1,1.5,2.1,C('e3f6ff'),a.yaw+raceTime*.9);cone(a.x,1.25,a.z,1.1,.7,C('bce5ff'),7);}else{let c=C(g.type===3?'fa4cf0':'e7b849');box(a.x,.16,a.z,p.w*2,2.7,.48,c,a.yaw);box(a.x,1.1,a.z,p.w*2.05,.26,.55,C('fff1b4'),a.yaw);for(let side of [-1,1]){let q=at(g.s,p.lane+side*p.w);box(q.x,0,q.z,.22,3,.22,C('f6eaff'),q.yaw);}}}}

function altitude(r){let loop=parkLoop(r.s);if(loop!==null&&!r.roof&&!r.short&&!r.fall&&!r.jump&&!r.air&&!r.wall)return parkHeight(loop)+r.lane*Math.sin(loop*TAU);if(r.roof)return roofCurve(r.roof.t).y;if(r.short)return .12;if(r.fall)return -Math.min(24,3*r.fall.t+10*r.fall.t*r.fall.t);if(r.jump){let t=Math.min(1,r.jump.t/r.jump.dur);return r.jump.y*(1-t)+Math.sin(Math.PI*t)*(r.jump.roofRoll!=null?0:r.jump.gravity?5:2.65);}if(r.wall)return wallY(r.s,r.lane);if(r.air){let t=Math.max(0,Math.min(1,(r.s-r.air.start)/r.air.range));return 2.6*(1-t)+Math.sin(Math.PI*t)*6.1;}return Math.abs(r.lane)<5.25?rampHeight(r.s):0;}

function onlineRuleTick(){
  const n=online;
  if(!n||n.phase!=='race'||!n.host)return false;
  if(n.rule==='turbo'&&raceTime>=n.nextTurbo){
    for(let r of [player,...bots])if(r.finishTime==null&&!r.eliminated)r.coins=5;
    n.nextTurbo+=12;flash('⚡ ターボ祭り！全員コイン5枚！');
  }
  if(n.rule!=='elimination')return false;
  while(raceTime>=n.nextElim){
    let active=[player,...bots].filter(r=>!r.eliminated&&r.finishTime==null).sort((a,b)=>b.s-a.s);
    if(active.length<=1)break;
    const loser=active[active.length-1];loser.eliminated=true;loser.finishTime=raceTime;loser.speed=0;n.elimOrder.push(loser);
    n.nextElim+=20;flash(loser.name+' 脱落！ 残り'+(active.length-1)+'台');
    if(active.length===2){
      const winner=active.find(r=>r!==loser);winner.finishTime=raceTime;
      finishOrder=[winner,...n.elimOrder.slice().reverse()];
      netFinish();return true;
    }
  }
  return true;
}

async function refreshPresence(seq){

    let response;

    if(!response.ok)throw Error('presence unavailable');

    if(seq!==presenceSeq || !online || online.phase!=='menu' || !$('presenceCasual'))return;

    }
    $('presenceTotal').textContent='オンライン合計 '+data.total+'人（カジュアル・ランク）';
  }catch(e){
    if(seq===presenceSeq && $('presenceCasual')){
      $('presenceCasual').textContent='人数を取得できません';
      $('presenceRanked').textContent='人数を取得できません';
      $('presenceTotal').textContent='通信状況を確認してください';

}
